name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) requires npm >= 11.5.1, newer than the npm
      # bundled with Node 22.
      - run: npm install -g npm@latest

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # Authenticates via OIDC trusted publishing; no NPM_TOKEN needed.
      - name: Publish to NPM
        run: npm publish --provenance --access public

      # Only meaningful for tag pushes; a manual dispatch has no tag to attach to.
      - name: Create GitHub Release with dist assets
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/moderok.js
            dist/moderok.cjs
            dist/moderok.min.js
            dist/moderok.d.ts
            dist/moderok.d.cts
          generate_release_notes: true
